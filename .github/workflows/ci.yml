name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check main.js
      - run: node --check preload.js
      - run: node --check renderer.js
      # Runs the Electron binary as plain Node: verifies the install
      # without needing a display or the Linux SUID sandbox.
      - run: ELECTRON_RUN_AS_NODE=1 npx electron -e "console.log('electron ' + process.versions.electron)"
