<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https: glance-file:;" />
  <title>Glance</title>
  <script src="./theme-init.js"></script>
  <link rel="stylesheet" href="./vendor/fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span>glance</span>
        <button class="icon-btn" id="toggleSidebarBtn" type="button" title="Collapse sidebar (Ctrl+B)">&#9703;</button>
      </div>
      <div class="sidebar-head">
        <div class="sidebar-section" id="sidebarSection">open files</div>
        <button class="icon-btn sidebar-search-btn" id="sidebarSearchBtn" type="button" title="Search (Ctrl+Shift+F)" aria-label="Search files" aria-pressed="false">
          <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="7" cy="7" r="4.25"></circle>
            <path d="m10.2 10.2 3 3"></path>
          </svg>
        </button>
      </div>
      <ul class="file-list" id="fileList">
        <li class="file-list-empty" id="fileListEmpty">nothing open yet</li>
      </ul>
      <div class="search-view" id="searchView" hidden>
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="7" cy="7" r="4.25"></circle>
            <path d="m10.2 10.2 3 3"></path>
          </svg>
          <input class="search-input" id="sidebarSearchInput" type="text" placeholder="search folder" aria-label="Search files" autocomplete="off" spellcheck="false" />
          <button class="search-close" id="sidebarSearchClose" type="button" title="Show opened files" aria-label="Close search">&#215;</button>
        </div>
        <div class="search-status" id="sidebarSearchStatus" aria-live="polite">type to search</div>
        <ul class="search-results" id="sidebarSearchResults"></ul>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="showSidebarBtn" type="button" title="Show sidebar (Ctrl+B)" hidden>&#9703;</button>
        <button class="icon-btn" id="openFileBtn" type="button" title="Open file (Ctrl+O)">&#8862;</button>
        <span class="filename" id="filename">README Viewer</span>
        <span class="drop-hint" id="dropHint" hidden>drop to open</span>
        <button class="icon-btn toc-toggle" id="tocToggle" type="button" title="Hide contents (Ctrl+Shift+O)" aria-label="Hide contents" aria-pressed="true" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="2.25" y="3.25" width="11.5" height="9.5" rx="1.25"></rect>
            <path d="M9.75 3.5v9"></path>
            <path d="M4.5 6h3M4.5 8h3"></path>
          </svg>
        </button>
        <button class="icon-btn theme-toggle" id="themeToggle" type="button" title="Toggle theme (Ctrl+T)">&#9681;</button>
      </header>

      <div class="pane">
        <main class="reading" id="readingPane" tabindex="-1">
          <div class="notice" id="staleNotice" hidden>File no longer exists on disk</div>
          <div class="notice" id="linkNotice" hidden></div>
          <div class="empty-state" id="emptyState">
            <p class="empty-title">No file open</p>
            <p class="empty-body">Drag a .md file here or use File &gt; Open (Ctrl/&#8984;+O)</p>
            <button class="btn" id="emptyOpenBtn" type="button">Open file</button>
          </div>
          <article class="markdown-body" id="markdownBody" hidden></article>
        </main>

        <aside class="toc" id="toc" hidden>
          <div class="toc-label">contents</div>
          <ul class="toc-list" id="tocList"></ul>
        </aside>

        <div class="find-bar" id="findBar" hidden>
          <div class="find-field">
            <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <circle cx="7" cy="7" r="4.25"></circle>
              <path d="m10.2 10.2 3 3"></path>
            </svg>
            <input class="find-input" id="findInput" type="text" placeholder="find in document" aria-label="Find in document" autocomplete="off" spellcheck="false" />
          </div>
          <span class="find-count" id="findCount" aria-live="polite"></span>
          <button class="find-case" id="findCase" type="button" aria-pressed="false" title="Match case">Aa</button>
        </div>
      </div>

      <section class="help-view" id="helpView" hidden aria-label="Help">
        <div class="help-bar">
          <span class="help-title">help</span>
          <button class="help-close" id="helpClose" type="button" title="Close help (Esc)">close</button>
        </div>
        <div class="help-scroll" id="helpScroll">
          <article class="markdown-body help-body" id="helpBody"></article>
        </div>
      </section>
    </div>
  </div>

  <script src="./node_modules/markdown-it/dist/markdown-it.min.js"></script>
  <script src="./node_modules/markdown-it-anchor/dist/markdownItAnchor.umd.js"></script>
  <script src="./node_modules/markdown-it-footnote/dist/markdown-it-footnote.min.js"></script>
  <script src="./node_modules/markdown-it-emoji/dist/markdown-it-emoji.min.js"></script>
  <script src="./vendor/highlight.min.js"></script>
  <script src="./node_modules/dompurify/dist/purify.min.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
